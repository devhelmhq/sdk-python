[project]
name = "devhelm"
version = "1.12.0"
description = "DevHelm SDK for Python — typed client for monitors, incidents, alerting, and more"
authors = [{ name = "DevHelm", email = "hello@devhelm.io" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["devhelm", "monitoring", "sdk", "uptime", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.0",
]

[project.urls]
Homepage = "https://github.com/devhelmhq/sdk-python"
Repository = "https://github.com/devhelmhq/sdk-python.git"
Issues = "https://github.com/devhelmhq/sdk-python/issues"

[build-system]
# hatchling 1.30+ emits Metadata-Version 2.5, which released twine and
# PyPI still reject. Cap until twine ships 2.5 support and warehouse
# accepts it (pypa/twine#1317, pypi/warehouse#19083).
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devhelm"]

[tool.uv]
default-groups = "all"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "mypy>=1.15",
    "datamodel-code-generator>=0.30",
    "build>=1.0",
    "twine>=6.0",
]

[tool.ruff.lint]
# ANN401: no `Any` in any annotation (doc 42 §5.1.2). tests/test_public_types.py
# walks the exported type surface for the same rule.
extend-select = ["C90", "I", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/devhelm/_generated.py" = ["I001"]
# Tests decode raw JSON from the harness; the public-API rule is for src/.
"tests/**" = ["ANN401"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["devhelm"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
# P5 (cast budget): _generated.py is checked in strict mode along with
# everything else. The single justified suppression in there is the
# `[assignment]` collision documented in scripts/typegen.sh.
#
# `disallow_any_explicit` is enforced everywhere except the modules below,
# which declare pydantic models: the pydantic mypy plugin synthesises
# ``__init__(**data: Any)`` on every model. No annotation written in this
# package uses `Any` (free-form JSON is `JsonValue`), which ruff ANN401 and
# tests/test_public_types.py enforce.

[[tool.mypy.overrides]]
module = [
    "devhelm._pages",
    "devhelm._validation",
    "devhelm._generated",
]
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
